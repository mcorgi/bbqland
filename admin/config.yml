# Decap CMS: the editor at /admin. Edits are saved to content/*.json in GitHub;
# scripts/build.mjs turns them into the pages. https://decapcms.org/docs/

# Login via DecapBridge (decapbridge.com), PKCE: editors sign in with Google or
# email/password, no GitHub account needed. Block generated by the DecapBridge
# dashboard; regenerate there if the site is ever recreated.
backend:
  name: git-gateway
  repo: mcorgi/bbqland
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/07ef7b1b-1dbe-4d8d-88d8-8dc653315ebc/pkce
  auth_token_endpoint: /sites/07ef7b1b-1dbe-4d8d-88d8-8dc653315ebc/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Fill the editor's name and avatar from their login
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Changes are saved as drafts (each one a branch, which Vercel builds as a
# preview site) and only go live when someone clicks Publish.
publish_mode: editorial_workflow

# On localhost, `npx decap-server` lets you try the editor without logging in.
local_backend: true

site_url: https://www.bbqlandma.com
display_url: https://www.bbqlandma.com
logo_url: /images/logo/seal-v2.png
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: menu
    label: Menu
    description: "Everything on the Menu page. Click a section, make changes, then Save. Nothing is live until you Publish."
    format: json
    editor: { preview: true }
    files:
      - name: lunch
        label: Lunch specials
        file: content/menu-lunch.json
        fields:
          - &intro { label: Short introduction, name: intro, widget: text, hint: "The sentence under the section title" }
          - label: Lunch grill combo
            name: combo
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string, required: false, hint: "Small label on top, e.g. Soft opening special. Leave empty to hide." }
              - { label: Title, name: title, widget: string }
              - { label: Note, name: note, widget: text, required: false }
              - label: Prices
                name: prices
                widget: list
                summary: "{{fields.label}} · ${{fields.price}}"
                fields:
                  - { label: Label, name: label, widget: string, hint: "e.g. 2 grill items" }
                  - { label: Price ($), name: price, widget: number, value_type: float, min: 0, step: 0.01 }
                  - { label: Old price ($), name: was, widget: number, value_type: float, min: 0, step: 0.01, required: false, hint: "Shown crossed out. Leave empty for none." }
              - label: Grill items to choose from
                name: items
                widget: list
                field: { label: Item, name: item, widget: string }
              - { label: Small print, name: footnote, widget: text, required: false }
          - label: Soup and rice sets
            name: sets
            widget: list
            summary: "{{fields.title}} · ${{fields.price}}"
            fields:
              - { label: Name, name: title, widget: string }
              - { label: Price ($), name: price, widget: number, value_type: float, min: 0, step: 0.01 }
              - { label: Old price ($), name: was, widget: number, value_type: float, min: 0, step: 0.01, required: false, hint: "Shown crossed out. Leave empty for none." }
              - { label: Choose one of, name: choices, widget: string, required: false, hint: "e.g. Beef Don, Yakiniku Don or Wagyu Fried Rice" }
              - { label: Served with, name: servedWith, widget: text }

      - name: grill
        label: For the grill
        file: content/menu-grill.json
        fields:
          - *intro
          - &dish_groups
            label: Categories
            name: groups
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: Category name, name: title, widget: string }
              - label: Column on the page
                name: column
                widget: select
                default: left
                options: [{ label: Left, value: left }, { label: Right, value: right }]
              - label: Dishes
                name: items
                widget: list
                summary: "{{fields.code}} {{fields.name}} · ${{fields.price}}"
                collapsed: true
                fields:
                  - { label: Code, name: code, widget: string, required: false, hint: "As on the printed menu, e.g. B03" }
                  - { label: Name, name: name, widget: string }
                  - { label: Price ($), name: price, widget: number, value_type: float, min: 0, step: 0.01 }
                  - { label: Smaller size, name: priceNote, widget: string, required: false, hint: "Optional, shown under the price, e.g. small 4" }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Chef's recommendation, name: chefsPick, widget: boolean, default: false }
                  - { label: Vegetarian, name: vegetarian, widget: boolean, default: false }
                  - label: Toast order link
                    name: toastUrl
                    widget: string
                    required: false
                    pattern: ["^(https://\\S+)?$", "Paste the full link, starting with https://"]
                    hint: "Open the dish on Toast online ordering and copy the address. Leave empty if it can't be ordered online."

      - name: kitchen
        label: From the kitchen
        file: content/menu-kitchen.json
        fields: [*intro, *dish_groups]

      - name: sets
        label: Signature sets
        file: content/menu-sets.json
        fields:
          - *intro
          - label: Sets
            name: sets
            widget: list
            summary: "{{fields.name}} {{fields.size}} · ${{fields.price}}"
            hint: "Also listed with prices on the home page"
            fields:
              - { label: Name, name: name, widget: string, hint: "e.g. Meat Lover" }
              - { label: Size, name: size, widget: string, required: false, hint: "e.g. for 2" }
              - { label: Price ($), name: price, widget: number, value_type: float, min: 0, step: 0.01 }
              - { label: For the grill, name: grill, widget: list, field: { label: Item, name: item, widget: string } }
              - { label: From the kitchen, name: kitchen, widget: list, field: { label: Item, name: item, widget: string } }
              - label: Toast order link
                name: toastUrl
                widget: string
                required: false
                pattern: ["^(https://\\S+)?$", "Paste the full link, starting with https://"]

      - name: drinks
        label: Drinks & dessert
        file: content/menu-drinks.json
        fields: [*intro, *dish_groups]

  - name: info
    label: Hours & dates
    format: json
    editor: { preview: true }
    files:
      - name: hours
        label: Opening hours & grand opening
        file: content/hours.json
        fields:
          - label: Grand opening date
            name: grandOpening
            widget: datetime
            format: YYYY-MM-DD
            date_format: "MMMM D, YYYY"
            time_format: false
            required: false
            default: ""
            hint: "Before this date the home page says “Soft opening now · Grand opening …”. Clear it to hide the line."
          - { label: Show “Open now / Closed” on the site, name: showOpenNow, widget: boolean, default: true, hint: "Turn off if the hours below might be wrong" }
          - label: Opening hours
            name: days
            widget: object
            fields:
              - label: Monday
                name: monday
                widget: object
                fields: &day_fields
                  - { label: Closed all day, name: closed, widget: boolean, default: false }
                  - { label: Opens, name: open, widget: datetime, date_format: false, time_format: "h:mm A", format: "HH:mm", required: false, default: "" }
                  - { label: Closes, name: close, widget: datetime, date_format: false, time_format: "h:mm A", format: "HH:mm", required: false, default: "" }
              - { label: Tuesday, name: tuesday, widget: object, fields: *day_fields }
              - { label: Wednesday, name: wednesday, widget: object, fields: *day_fields }
              - { label: Thursday, name: thursday, widget: object, fields: *day_fields }
              - { label: Friday, name: friday, widget: object, fields: *day_fields }
              - { label: Saturday, name: saturday, widget: object, fields: *day_fields }
              - { label: Sunday, name: sunday, widget: object, fields: *day_fields }
